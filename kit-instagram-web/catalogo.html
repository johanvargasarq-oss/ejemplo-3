<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | CreaYoyis</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink:     #F9C4D2;
      --blue:     #BFD9F2;
      --mint:     #C5EAD6;
      --lavender: #D8CCF0;
      --peach:    #FFD7B5;
      --dark:     #3D2B2B;
      --text:     #5C4A4A;
      --white:    #FFFFFF;
      --accent:   #E88FAE;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; color: var(--text); background: #FFFAF9; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 16px rgba(249,196,210,.25);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; height: 64px;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--dark); text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-back {
      display: flex; align-items: center; gap: .5rem;
      color: var(--text); text-decoration: none; font-size: .85rem; font-weight: 500;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--accent); }
    .nav-back svg { width: 16px; height: 16px; }
    .nav-cart-btn {
      background: linear-gradient(135deg, #F9C4D2, #E88FAE);
      color: #fff; border: none; padding: .45rem 1.2rem;
      border-radius: 50px; font-size: .85rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: .4rem;
      transition: opacity .2s;
    }
    .nav-cart-btn:hover { opacity: .85; }

    /* ── HEADER ── */
    .page-header {
      background: linear-gradient(135deg, #FFF5F8, #EEF7FF);
      padding: 2.5rem 5% 2rem;
      border-bottom: 1px solid #f0e8ec;
    }
    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; color: var(--dark); margin-bottom: .3rem;
    }
    .page-header p { font-size: .9rem; color: var(--text); opacity: .75; }

    /* ── FILTERS ── */
    .filters {
      display: flex; align-items: center; gap: .75rem;
      padding: 1.5rem 5%;
      border-bottom: 1px solid #f0e8ec;
      background: #fff;
      flex-wrap: wrap;
    }
    .filters span { font-size: .8rem; font-weight: 600; color: var(--text); opacity: .6; margin-right: .25rem; }
    .filter-btn {
      padding: .5rem 1.4rem; border-radius: 50px;
      border: 1.5px solid #e0d4d8;
      background: #fff; color: var(--text);
      font-family: 'Poppins', sans-serif; font-size: .82rem; font-weight: 500;
      cursor: pointer; transition: all .2s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: var(--dark); border-color: var(--dark);
      color: #fff;
    }
    .filter-count { font-size: .75rem; margin-left: .75rem; color: var(--text); opacity: .55; }

    /* ── GRID ── */
    .catalog-container { padding: 2rem 5% 4rem; }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 1100px) { .catalog-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 750px)  { .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; } }
    @media (max-width: 480px)  { .catalog-grid { grid-template-columns: 1fr; } }

    /* ── PRODUCT CARD ── */
    .product-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(61,43,43,.07);
      cursor: pointer;
      transition: transform .22s, box-shadow .22s;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(61,43,43,.13); }

    .card-img-wrap {
      position: relative; aspect-ratio: 3/4; overflow: hidden;
      background-color: #f7f0f3;
    }
    .card-img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: center top;
      transition: transform .35s;
    }
    .product-card:hover .card-img { transform: scale(1.04); }

    .card-badge {
      position: absolute; top: .7rem; left: .7rem;
      background: var(--dark); color: #fff;
      font-size: .65rem; font-weight: 700; letter-spacing: .06em;
      padding: .2rem .55rem; border-radius: 50px;
    }
    .card-badge.nina  { background: #E88FAE; }
    .card-badge.nino  { background: #5A9BD4; }
    .card-badge.unisex { background: #7BAF8E; }

    .card-plus {
      position: absolute; bottom: .75rem; right: .75rem;
      width: 36px; height: 36px; border-radius: 50%;
      background: #fff; border: 1.5px solid #e0d4d8;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: var(--dark); line-height: 1;
      opacity: 0; transform: scale(.85);
      transition: opacity .2s, transform .2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .product-card:hover .card-plus { opacity: 1; transform: scale(1); }

    .card-stock-badge {
      position: absolute; top: .7rem; right: .7rem;
      background: #FFE0E0; color: #C0392B;
      font-size: .6rem; font-weight: 700; letter-spacing: .04em;
      padding: .18rem .5rem; border-radius: 50px;
    }

    .card-info { padding: .85rem .9rem 1rem; flex: 1; display: flex; flex-direction: column; gap: .2rem; }
    .card-brand { font-size: .68rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
    .card-name  { font-size: .88rem; font-weight: 600; color: var(--dark); line-height: 1.3; }
    .card-rating {
      display: flex; align-items: center; gap: .3rem;
      font-size: .72rem; color: #888; margin-top: .1rem;
    }
    .stars { color: #F5A623; letter-spacing: -.5px; }
    .card-prices { display: flex; align-items: center; gap: .5rem; margin-top: auto; padding-top: .5rem; }
    .card-price { font-size: .95rem; font-weight: 700; color: var(--dark); }
    .card-original { font-size: .78rem; color: #aaa; text-decoration: line-through; }
    .card-discount {
      font-size: .68rem; font-weight: 700; color: #fff;
      background: #E88FAE; padding: .1rem .4rem; border-radius: 4px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem; display: none;
      grid-column: 1 / -1;
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { color: var(--text); opacity: .6; }

    /* ── PAGINATION ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: .5rem;
      padding: 1.5rem 5% 3rem;
    }
    .page-btn {
      min-width: 42px; height: 42px; padding: 0 .6rem;
      border-radius: 50px;
      border: 1.5px solid #e0d4d8;
      background: #fff; color: var(--text);
      font-family: 'Poppins', sans-serif; font-size: .85rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--dark); border-color: var(--dark); color: #fff; }
    .page-btn.nav-btn { padding: 0 1.1rem; font-size: .8rem; }
    .page-info {
      font-size: .8rem; color: var(--text); opacity: .55;
      padding: 0 .5rem; font-weight: 500;
    }

    /* ── CART SIDEBAR ── */
    .cart-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 200;
    }
    .cart-overlay.open { display: block; }
    .cart-sidebar {
      position: fixed; top: 0; right: -420px; bottom: 0;
      width: 400px; max-width: 95vw;
      background: #fff; z-index: 201;
      display: flex; flex-direction: column;
      box-shadow: -4px 0 32px rgba(0,0,0,.12);
      transition: right .3s;
    }
    .cart-sidebar.open { right: 0; }
    .cart-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #f0e8ec;
    }
    .cart-head h3 { font-size: 1rem; font-weight: 700; color: var(--dark); }
    .cart-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text); line-height: 1; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
    .cart-empty { text-align: center; padding: 3rem 1rem; color: var(--text); opacity: .55; font-size: .9rem; }
    .cart-item {
      display: flex; gap: .8rem; align-items: flex-start;
      padding: .9rem 0; border-bottom: 1px solid #f5f0f2;
    }
    .cart-item img { width: 64px; height: 72px; object-fit: cover; border-radius: 8px; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-info .ci-name { font-size: .83rem; font-weight: 600; color: var(--dark); }
    .cart-item-info .ci-meta { font-size: .75rem; color: #888; margin-top: .15rem; }
    .ci-bottom { display: flex; align-items: center; gap: .6rem; margin-top: .35rem; }
    .ci-qty {
      border: 1.5px solid #e8d8df; border-radius: 8px;
      padding: .22rem .45rem; font-family: 'Poppins', sans-serif;
      font-size: .8rem; color: var(--dark); background: #fff; outline: none;
      width: 56px; text-align: center;
    }
    .ci-qty:focus { border-color: #E88FAE; }
    .ci-qty::-webkit-inner-spin-button { opacity: 1; }
    .cart-item-info .ci-price { font-size: .9rem; font-weight: 700; color: var(--dark); }
    .ci-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1.1rem; padding: .1rem; transition: color .2s; align-self: flex-start; }
    .ci-remove:hover { color: #E88FAE; }
    .cart-footer { padding: 1.2rem 1.5rem; border-top: 1px solid #f0e8ec; }
    .cart-total { display: flex; justify-content: space-between; font-weight: 700; color: var(--dark); margin-bottom: 1rem; font-size: 1rem; }
    .cart-wa-btn {
      display: block; width: 100%; text-align: center;
      background: #25D366; color: #fff;
      padding: .85rem; border-radius: 12px;
      font-weight: 700; font-size: .95rem; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      transition: opacity .2s;
    }
    .cart-wa-btn:hover { opacity: .88; }
    .float-cart-btn {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 150;
      background: var(--dark); color: #fff;
      width: 54px; height: 54px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      font-size: 1.3rem; transition: transform .2s;
    }
    .float-cart-btn:hover { transform: scale(1.08); }
    .cart-badge {
      position: absolute; top: -4px; right: -4px;
      background: var(--accent); color: #fff;
      width: 18px; height: 18px; border-radius: 50%;
      font-size: .65rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      display: none;
    }
    .cart-badge.visible { display: flex; }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="creayoyis.html" class="nav-back">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver
  </a>
  <a href="creayoyis.html" class="nav-logo">Crea<span>Yoyis</span></a>
  <button class="nav-cart-btn" onclick="toggleCart()">
    🛒 Cesta <span id="nav-cart-count" style="background:rgba(255,255,255,.3);border-radius:50px;padding:0 .4rem;font-size:.75rem;display:none"></span>
  </button>
</nav>

<!-- HEADER -->
<div class="page-header">
  <h1>Catálogo CreaYoyis</h1>
  <p>Ropa de bebé 100% algodón · Piedecuesta, Santander</p>
</div>

<!-- FILTERS -->
<div class="filters">
  <span>Filtrar:</span>
  <button class="filter-btn active" data-filter="nina" onclick="filterCatalog(this)">Niña</button>
  <button class="filter-btn" data-filter="nino" onclick="filterCatalog(this)">Niño</button>
  <span class="filter-count" id="filter-count"></span>
</div>

<!-- GRID -->
<div class="catalog-container" id="catalog-top">
  <div class="catalog-grid" id="catalog-grid">
    <!-- cards injected by JS -->
  </div>
</div>
<div class="pagination" id="pagination"></div>

<!-- FLOAT CART -->
<button class="float-cart-btn" onclick="toggleCart()" style="position:relative">
  🛒
  <span class="cart-badge" id="cart-badge"></span>
</button>

<!-- CART OVERLAY & SIDEBAR -->
<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-head">
    <h3>Mi Cesta</h3>
    <button class="cart-close" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items">
    <div class="cart-empty">Tu cesta está vacía</div>
  </div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-val"></span>
    </div>
    <a href="#" class="cart-wa-btn" id="cart-wa-link">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Pedir por WhatsApp
    </a>
  </div>
</div>

<script src="productos.js"></script>
<script>
  // ── Cart state ──────────────────────────────────────────────
  let cart = [];

  function formatPrice(n) {
    return '$' + n.toLocaleString('es-CO');
  }

  function discount(p, po) {
    return Math.round((1 - p / po) * 100);
  }

  function starsHtml(rating) {
    const full = Math.floor(rating);
    const half = rating % 1 >= 0.5;
    let s = '';
    for (let i = 0; i < full; i++) s += '★';
    if (half) s += '½';
    for (let i = full + (half ? 1 : 0); i < 5; i++) s += '☆';
    return s;
  }

  // ── Pagination state ────────────────────────────────────────
  const ITEMS_PER_PAGE = 28;
  let currentPage = 1;
  let currentFilter = 'todos';

  // ── Render grid ─────────────────────────────────────────────
  function renderGrid(filter, page) {
    page = page || 1;
    currentFilter = filter;
    currentPage = page;

    const grid = document.getElementById('catalog-grid');
    const all = filter === 'todos' ? PRODUCTOS : PRODUCTOS.filter(p => p.cat === filter);
    const totalPages = Math.ceil(all.length / ITEMS_PER_PAGE);
    const products = all.slice((page - 1) * ITEMS_PER_PAGE, page * ITEMS_PER_PAGE);

    document.getElementById('filter-count').textContent = all.length + ' productos';

    if (products.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="display:block;grid-column:1/-1"><div class="emoji">🔍</div><p>No hay productos en esta categoría</p></div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    grid.innerHTML = products.map(p => {
      const img = p.imagenes[0];
      const disc = discount(p.precio, p.precioOriginal);
      const badgeClass = p.cat === 'nina' ? 'nina' : p.cat === 'nino' ? 'nino' : 'unisex';
      const isLow = p.stock !== 'En stock';
      return `
        <a class="product-card" href="producto.html?id=${p.id}">
          <div class="card-img-wrap">
            <img class="card-img" src="${img}" alt="${p.nombre}" loading="lazy">
            <span class="card-badge ${badgeClass}">${p.badge}</span>
            ${isLow ? `<span class="card-stock-badge">Últimas!</span>` : ''}
            <div class="card-plus">+</div>
          </div>
          <div class="card-info">
            <div class="card-brand">CreaYoyis</div>
            <div class="card-name">${p.nombre}</div>
            <div class="card-rating">
              <span class="stars">${starsHtml(p.rating)}</span>
              <span>${p.rating} (${p.reviews})</span>
            </div>
            <div class="card-prices">
              <span class="card-price">${formatPrice(p.precio)}</span>
              <span class="card-original">${formatPrice(p.precioOriginal)}</span>
              <span class="card-discount">-${disc}%</span>
            </div>
          </div>
        </a>`;
    }).join('');

    renderPagination(page, totalPages, all.length);
  }

  function renderPagination(current, total, totalItems) {
    const el = document.getElementById('pagination');
    if (total <= 1) { el.innerHTML = ''; return; }

    const start = (current - 1) * ITEMS_PER_PAGE + 1;
    const end = Math.min(current * ITEMS_PER_PAGE, totalItems);

    let html = '';
    if (current > 1) {
      html += `<button class="page-btn nav-btn" onclick="goToPage(${current - 1})">← Anterior</button>`;
    }
    for (let i = 1; i <= total; i++) {
      html += `<button class="page-btn${i === current ? ' active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }
    if (current < total) {
      html += `<button class="page-btn nav-btn" onclick="goToPage(${current + 1})">Siguiente →</button>`;
    }
    html += `<span class="page-info">${start}–${end} de ${totalItems}</span>`;
    el.innerHTML = html;
  }

  function goToPage(p) {
    renderGrid(currentFilter, p);
    document.getElementById('catalog-top').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function filterCatalog(btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(btn.dataset.filter, 1);
  }

  // ── Cart ────────────────────────────────────────────────────
  function toggleCart() {
    document.getElementById('cart-overlay').classList.toggle('open');
    document.getElementById('cart-sidebar').classList.toggle('open');
  }

  function removeFromCart(idx) {
    cart.splice(idx, 1);
    sessionStorage.setItem('creayoyis_cart', JSON.stringify(cart));
    renderCart();
  }

  function changeQty(idx, qty) {
    cart[idx].qty = Math.max(1, parseInt(qty));
    sessionStorage.setItem('creayoyis_cart', JSON.stringify(cart));
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    const footer = document.getElementById('cart-footer');
    const badge = document.getElementById('cart-badge');
    const navCount = document.getElementById('nav-cart-count');

    if (cart.length === 0) {
      container.innerHTML = '<div class="cart-empty">Tu cesta está vacía</div>';
      footer.style.display = 'none';
      badge.classList.remove('visible');
      navCount.style.display = 'none';
      return;
    }

    const totalUnits = cart.reduce((s, i) => s + (i.qty || 1), 0);
    badge.textContent = totalUnits; badge.classList.add('visible');
    navCount.textContent = totalUnits; navCount.style.display = '';

    container.innerHTML = cart.map((item, i) => {
      const qty = item.qty || 1;
      return `
      <div class="cart-item">
        <img src="${item.img}" alt="${item.nombre}" />
        <div class="cart-item-info">
          <div class="ci-name">${item.nombre}</div>
          <div class="ci-meta">${item.color} · Talla ${item.talla}</div>
          <div class="ci-bottom">
            <input type="number" class="ci-qty" value="${qty}" min="1" onchange="changeQty(${i}, this.value)" oninput="changeQty(${i}, this.value)">
            <div class="ci-price">${formatPrice(item.precio * qty)}</div>
          </div>
        </div>
        <button class="ci-remove" onclick="removeFromCart(${i})">×</button>
      </div>`;
    }).join('');

    const total = cart.reduce((s, i) => s + i.precio * (i.qty || 1), 0);
    document.getElementById('cart-total-val').textContent = formatPrice(total);
    footer.style.display = '';

    const lines = cart.map(i => {
      const qty = i.qty || 1;
      return `• ${i.nombre} x${qty}\n  Color: ${i.color} · Talla: ${i.talla}\n  Precio: ${formatPrice(i.precio * qty)}`;
    }).join('\n\n');
    const msg = encodeURIComponent(`¡Hola CreaYoyis! 👋 Quiero hacer este pedido:\n\n${lines}\n\n*Total: ${formatPrice(total)}*\n\n¿Tienen disponibilidad? Por favor envíenme las fotos de las prendas para confirmar. 📸`);
    document.getElementById('cart-wa-link').href = `https://wa.me/573156342903?text=${msg}`;
  }

  // Expose so producto.html can add via postMessage or sessionStorage
  window.addEventListener('storage', () => {
    const saved = sessionStorage.getItem('creayoyis_cart');
    if (saved) { cart = JSON.parse(saved); renderCart(); }
  });

  // Init — respect ?filter= and ?search= URL params
  const urlParams = new URLSearchParams(location.search);
  const urlFilter = urlParams.get('filter') || 'nina';
  const urlSearch = urlParams.get('search') || '';
  const initBtn = document.querySelector(`[data-filter="${urlFilter}"]`) || document.querySelector('[data-filter="nina"]');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  initBtn.classList.add('active');

  if (urlSearch) {
    const nums = urlSearch.match(/\d{3,}/g);
    let found = [];
    if (nums) {
      for (const n of nums) {
        found = PRODUCTOS.filter(p => p.nombre.includes(n));
        if (found.length) break;
      }
    }
    if (!found.length) {
      const q = urlSearch.toLowerCase();
      found = PRODUCTOS.filter(p => p.nombre.toLowerCase().includes(q));
    }
    if (found.length === 1) {
      window.location.href = 'producto.html?id=' + found[0].id;
    } else {
      const grid = document.getElementById('catalog-grid');
      document.getElementById('filter-count').textContent = found.length + ' resultados';
      grid.innerHTML = found.map(p => {
        const img = p.imagenes[0];
        const disc = discount(p.precio, p.precioOriginal);
        const badgeClass = p.cat === 'nina' ? 'nina' : p.cat === 'nino' ? 'nino' : 'unisex';
        return `<a class="product-card" href="producto.html?id=${p.id}">
          <div class="card-img-wrap"><img class="card-img" src="${img}" alt="${p.nombre}" loading="lazy">
          <span class="card-badge ${badgeClass}">${p.badge}</span><div class="card-plus">+</div></div>
          <div class="card-info"><div class="card-brand">CreaYoyis</div>
          <div class="card-name">${p.nombre}</div>
          <div class="card-prices"><span class="card-price">${formatPrice(p.precio)}</span>
          <span class="card-original">${formatPrice(p.precioOriginal)}</span>
          <span class="card-discount">-${disc}%</span></div></div></a>`;
      }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#aaa;">No encontramos esa referencia</div>';
    }
  } else {
    renderGrid(urlFilter, 1);
  }

  const savedCart = sessionStorage.getItem('creayoyis_cart');
  if (savedCart) { cart = JSON.parse(savedCart); renderCart(); }
</script>
</body>
</html>
